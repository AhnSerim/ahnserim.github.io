<!doctype html>
<html lang="{{ site.lang | default: 'ko' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#070a1c">
  {% seo %}
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <script>
    // Enable scroll-reveal before first paint (avoids a flash of content).
    // Failsafe: if scroll-fx.js never runs, show everything on load.
    (function (d) {
      if ('IntersectionObserver' in window && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
        d.classList.add('fx-reveal');
        addEventListener('load', function () { if (!window.__scrollFx) d.classList.remove('fx-reveal'); });
      }
    })(document.documentElement);
  </script>
  <script src="{{ '/assets/js/nav.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
  <script src="{{ '/assets/js/scroll-fx.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>
  {% include space-bg.html %}
  {% include header.html %}

  <main id="main" class="site-main" tabindex="-1">
    {{ content }}
  </main>

  {% include footer.html %}
</body>
</html>
