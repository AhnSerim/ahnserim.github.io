title: "Serim's space"
description: "C · C++ · 컴퓨터 아키텍처 공부와 독서 기록"
lang: ko
url: "https://serim.space"
baseurl: ""
author: serim ahn
repository: AhnSerim/ahnserim.github.io
theme: null # no built-in GitHub Pages theme; layouts live in this repo

# Keep the original date-based URLs (/YYYY/MM/DD/slug.html) explicitly,
# so adding categories/sections to posts never changes existing links.
permalink: /:year/:month/:day/:title:output_ext

timezone: Asia/Seoul
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: highlight

# Guestbook (giscus → GitHub Discussions). The guestbook shows a
# "SIGNAL OFFLINE" notice until category_id is filled in.
# Get the values at https://giscus.app after enabling Discussions.
giscus:
  repo: AhnSerim/ahnserim.github.io
  repo_id: R_kgDOR9F2pg
  category: Guestbook
  category_id: "" # e.g. DIC_kwDO...
  term: guestbook # every visitor writes into this single discussion

plugins:
  - jekyll-seo-tag

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "" }
    values: { layout: default }

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - DESIGN.md
  - CLAUDE.md
  - vendor
  - .jekyll-cache
